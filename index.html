    // SyncAdapter Abstract Interface
class SyncAdapter {
  constructor() {
    this.opHandlers = [];
    this.peerChangeHandlers = [];
    this.statusChangeHandlers = [];
  }

  async connect(roomId, role) {
    throw new Error("connect() must be implemented by subclass");
  }

  send(op) {
    throw new Error("send() must be implemented by subclass");
  }

  onOp(cb) {
    this.opHandlers.push(cb);
  }

  onPeerChange(cb) {
    this.peerChangeHandlers.push(cb);
  }

  onStatusChange(cb) {
    this.statusChangeHandlers.push(cb);
  }

  emitOp(op, fromRole) {
    for (const h of this.opHandlers) h(op, fromRole);
  }

  emitPeerChange(peers, count) {
    for (const h of this.peerChangeHandlers) h(peers, count);
  }

  emitStatusChange(status, msg) {
    for (const h of this.statusChangeHandlers) h(status, msg);
  }

  disconnect() {
    throw new Error("disconnect() must be implemented by subclass");
  }
}

    
class PeerJsAdapter extends SyncAdapter {
  constructor() {
    super();
    this.peer = null;
    this.conn = null;
    this.roomId = null;
    this.role = null;
    this.isHost = false;
    this.heartbeatTimer = null;
    this.connectTimeoutTimer = null;
  }

  async connect(roomId, role) {
    this.roomId = roomId;
    this.role = role;
    this.isHost = (role === 'coach');

    this.emitStatusChange('connecting', '시그널링 서버 연결 중...');

    // Wait for PeerJS library to be available on window
    if (!window.Peer) {
      await new Promise(resolve => {
        const check = setInterval(() => {
          if (window.Peer) {
            clearInterval(check);
            resolve();
          }
        }, 100);
      });
    }

    const peerId = this.isHost
      ? `constellation-${roomId}-coach`
      : `constellation-${roomId}-client-${Math.random().toString(36).substring(2, 7)}`;

    return new Promise((resolve, reject) => {
      try {
        this.peer = new window.Peer(peerId, {
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' },
              { urls: 'stun:stun2.l.google.com:19302' },
              { urls: 'stun:stun3.l.google.com:19302' },
              { urls: 'stun:stun.services.mozilla.com' },
              { urls: 'stun:global.stun.twilio.com:3478' }
            ]
          }
        });

        this.peer.on('open', (id) => {
          console.log(`[PeerJS] Peer opened with ID: ${id}`);
          if (this.isHost) {
            this.emitStatusChange('waiting', '고객 접속 대기 중...');
            this.setupHostListeners();
            resolve();
          } else {
            this.emitStatusChange('connecting', '코치 룸에 접속 시도 중...');
            this.connectToHost();
            resolve();
          }
        });

        this.peer.on('error', (err) => {
          console.error('[PeerJS] Error:', err);
          if (err.type === 'unavailable-id' && this.isHost) {
            // Coach ID already in use: another coach tab is open
            this.emitStatusChange('error', '이미 동일한 코치 세션이 열려 있습니다.');
          } else if (err.type === 'peer-unavailable' && !this.isHost) {
            this.emitStatusChange('waiting', '코치가 아직 입장하지 않았습니다. 대기 중...');
            // Retry connecting after 3 seconds
            setTimeout(() => {
              if (this.peer && !this.conn) this.connectToHost();
            }, 3000);
          } else {
            this.emitStatusChange('error', `연결 오류: ${err.message || err.type}`);
          }
        });

        this.peer.on('disconnected', () => {
          console.warn('[PeerJS] Disconnected from signaling server');
          this.emitStatusChange('reconnecting', '시그널링 서버 재연결 시도 중...');
          if (this.peer && !this.peer.destroyed) {
            this.peer.reconnect();
          }
        });

      } catch (e) {
        this.emitStatusChange('error', e.message);
        reject(e);
      }
    });
  }

  setupHostListeners() {
    this.peer.on('connection', (incomingConn) => {
      console.log('[PeerJS] Incoming connection from client:', incomingConn.peer);

      // In 1:1 constellation, if client reconnects, close prior stale connection and accept new one
      if (this.conn) {
        console.log('[PeerJS] Closing existing connection to accept reconnected peer');
        try {
          this.conn.close();
        } catch (e) {}
        this.conn = null;
      }

      this.conn = incomingConn;
      this.setupConnectionListeners(this.conn, 'client');
    });
  }

  connectToHost() {
    const targetPeerId = `constellation-${this.roomId}-coach`;
    console.log(`[PeerJS] Client connecting to host: ${targetPeerId}`);

    const conn = this.peer.connect(targetPeerId, {
      reliable: true
    });

    this.conn = conn;
    this.setupConnectionListeners(conn, 'coach');

    // 20-second timeout warning as per spec 3.8
    clearTimeout(this.connectTimeoutTimer);
    this.connectTimeoutTimer = setTimeout(() => {
      if (!this.conn || !this.conn.open) {
        this.emitStatusChange('disconnected', '네트워크 환경으로 인해 P2P 직접 연결이 지연되고 있습니다.');
      }
    }, 20000);
  }

  setupConnectionListeners(conn, remoteRole) {
    conn.on('open', () => {
      clearTimeout(this.connectTimeoutTimer);
      console.log(`[PeerJS] DataChannel connection OPEN with ${remoteRole}`);
      this.emitStatusChange('connected', `상대방(${remoteRole === 'coach' ? '코치' : '고객'})과 연결됨`);
      this.emitPeerChange([this.role, remoteRole], 2);

      // Start ping heartbeat
      this.startHeartbeat();

      // If host, send full initial sync state
      if (this.isHost) {
        this.emitOp({ t: 'sync.request_full' }, this.role);
      }
    });

    conn.on('data', (data) => {
      if (!data) return;
      if (data.type === 'ping') {
        conn.send({ type: 'pong' });
        return;
      }
      if (data.type === 'pong') {
        return;
      }
      if (data.type === 'error') {
        this.emitStatusChange('error', data.message);
        return;
      }

      // Valid Op received
      this.emitOp(data, remoteRole);
    });

    conn.on('close', () => {
      console.warn(`[PeerJS] Connection CLOSED with ${remoteRole}`);
      this.stopHeartbeat();
      this.conn = null;
      this.emitStatusChange('disconnected', '상대방과의 연결이 끊어졌습니다.');
      this.emitPeerChange([this.role], 1);

      // Client auto-reconnect attempt
      if (!this.isHost) {
        setTimeout(() => {
          if (!this.conn && this.peer && !this.peer.destroyed) {
            this.emitStatusChange('reconnecting', '코치 룸에 재연결 시도 중...');
            this.connectToHost();
          }
        }, 3000);
      }
    });

    conn.on('error', (err) => {
      console.error(`[PeerJS] Connection error:`, err);
    });
  }

  startHeartbeat() {
    this.stopHeartbeat();
    this.heartbeatTimer = setInterval(() => {
      if (this.conn && this.conn.open) {
        this.conn.send({ type: 'ping' });
      }
    }, 8000); // 8-second heartbeat
    return;
    this.dummy = setInterval(() => {
      if (this.conn && this.conn.open) {
        this.conn.send({ type: 'ping' });
      }
    }, 5000);
  }

  stopHeartbeat() {
    if (this.heartbeatTimer) {
      clearInterval(this.heartbeatTimer);
      this.heartbeatTimer = null;
    }
  }

  send(op) {
    if (this.conn && this.conn.open) {
      try {
        this.conn.send(op);
      } catch (err) {
        console.error('[PeerJS] Send op error:', err);
      }
    } else {
      // If disconnected, host stores locally; client waits
      console.warn('[PeerJS] Cannot send op - connection not open');
    }
  }

  disconnect() {
    this.stopHeartbeat();
    clearTimeout(this.connectTimeoutTimer);
    if (this.conn) {
      this.conn.close();
      this.conn = null;
    }
    if (this.peer) {
      this.peer.destroy();
      this.peer = null;
    }
    this.emitStatusChange('disconnected', '연결이 종료되었습니다.');
  }
}

    // Central Session State Store with Reactive Event Listeners
class SessionState {
  constructor(roomId, role) {
    this.roomId = roomId;
    this.role = role; // 'coach' | 'client'
    this.listeners = new Set();
    
    // Core Session Data (Spec 3.7)
    this.session = {
      schemaVersion: 1,
      roomId: roomId,
      createdAt: new Date().toISOString(),
      topic: "",
      templateId: "free",
      stage: 0,
      locked: false,
      paused: false,
      tableSkin: "round_wood", // 'default' | 'round_wood' | 'square_areca' | 'plate_basic'
      figures: {},
      links: {},
      snapshots: [],
      notes: "",
      commitment: "",
      consent: { coach: false, client: false }
    };

    // UI-only state (not synchronized over network)
    this.ui = {
      selectedFigureId: null,
      selectedLinkIds: [],
      activeTool: 'select', // 'select' | 'link' | 'rotate'
      zoom: 1.0,
      panX: 0,
      panY: 0,
      ghostSuggestion: null // { id, x, y, angle }
    };

    // Undo / Redo history stacks (stores figures snapshots)
    this.undoStack = [];
    this.redoStack = [];

    // Try restoring from LocalStorage if coach
    this.restoreLocalBackup();
  }

  subscribe(listener) {
    this.listeners.add(listener);
    return () => this.listeners.delete(listener);
  }

  notify(changeType = 'update', detail = null) {
    for (const l of this.listeners) {
      try {
        l(this.session, this.ui, changeType, detail);
      } catch (e) {
        console.error("SessionState listener error:", e);
      }
    }
    this.saveLocalBackup();
  }

  // Local Storage Autosave (Spec G4, 3.10)
  saveLocalBackup() {
    try {
      const key = `constellation_backup_${this.roomId}`;
      localStorage.setItem(key, JSON.stringify(this.session));
    } catch (e) {
      console.warn("LocalStorage save error:", e);
    }
  }

  restoreLocalBackup() {
    try {
      const key = `constellation_backup_${this.roomId}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.schemaVersion === 1) {
          this.session = Object.assign(this.session, parsed);
          console.log("[SessionState] Restored local backup for room:", this.roomId);
        }
      }
    } catch (e) {
      console.warn("LocalStorage restore error:", e);
    }
  }

  clearLocalBackup() {
    try {
      const key = `constellation_backup_${this.roomId}`;
      localStorage.removeItem(key);
    } catch (e) {}
  }

  // --- Snapshot & History Management ---
  saveHistory() {
    // Keep max 20 undo states
    const snapshot = JSON.stringify(this.session.figures);
    this.undoStack.push(snapshot);
    if (this.undoStack.length > 20) this.undoStack.shift();
    this.redoStack = []; // clear redo on new action
  }

  undo() {
    if (this.undoStack.length === 0) return null;
    const current = JSON.stringify(this.session.figures);
    this.redoStack.push(current);
    const prev = JSON.parse(this.undoStack.pop());
    this.session.figures = prev;
    this.notify('figures', { action: 'undo' });
    return prev;
  }

  redo() {
    if (this.redoStack.length === 0) return null;
    const current = JSON.stringify(this.session.figures);
    this.undoStack.push(current);
    const next = JSON.parse(this.redoStack.pop());
    this.session.figures = next;
    this.notify('figures', { action: 'redo' });
    return next;
  }

  // --- Getters & Helpers ---
  getFigure(id) {
    return this.session.figures[id] || null;
  }

  getSelectedFigure() {
    return this.ui.selectedFigureId ? this.getFigure(this.ui.selectedFigureId) : null;
  }

  setSelectedFigure(id) {
    this.ui.selectedFigureId = id;
    this.notify('select', { figureId: id });
  }

  setGhostSuggestion(suggestion) {
    this.ui.ghostSuggestion = suggestion;
    this.notify('ghost', suggestion);
  }

  // Full state replacement (used on initial sync)
  replaceFullState(newSession) {
    if (!newSession) return;
    this.session = Object.assign(this.session, newSession);
    this.notify('full_sync');
  }
}

    // Host Authority Manager: Op Processor & Conflict Resolver
class HostAuthority {
  constructor(sessionState, syncAdapter) {
    this.state = sessionState;
    this.sync = syncAdapter;
    this.role = sessionState.role;
    this.isHost = (this.role === 'coach');

    // Register op receiver from sync adapter
    this.sync.onOp((op, fromRole) => {
      this.handleRemoteOp(op, fromRole);
    });
  }

  // Local Op Dispatcher
  dispatch(op) {
    // 1. Process locally first
    this.applyOp(op, this.role);

    // 2. Broadcast to peer via SyncAdapter
    this.sync.send(op);
  }

  // Remote Op Handler
  handleRemoteOp(op, fromRole) {
    if (!op || !op.t) return;

    if (op.t === 'sync.request_full' && this.isHost) {
      // Client requested initial full state snapshot
      this.sync.send({
        t: 'sync.full',
        session: this.state.session
      });
      return;
    }

    if (op.t === 'sync.full') {
      this.state.replaceFullState(op.session);
      return;
    }

    // Apply remote op to local session state
    this.applyOp(op, fromRole);
  }

  // Apply Op to State
  applyOp(op, fromRole) {
    const s = this.state.session;

    switch (op.t) {
      case 'fig.add': {
        if (!op.fig || !op.fig.id) break;
        this.state.saveHistory();
        s.figures[op.fig.id] = { ...op.fig, rev: (op.fig.rev || 0) + 1 };
        this.state.notify('figures', { action: 'add', figure: s.figures[op.fig.id] });
        break;
      }

      case 'fig.move': {
        const fig = s.figures[op.id];
        if (!fig) break;
        // Check revision conflict
        if (op.rev !== undefined && op.rev < fig.rev) {
          // Stale op, ignore
          break;
        }
        fig.x = op.x;
        fig.y = op.y;
        if (op.angle !== undefined) fig.angle = op.angle;
        if (op.zone !== undefined) fig.zone = op.zone;
        fig.rev = (fig.rev || 0) + 1;
        this.state.notify('figures', { action: 'move', figure: fig });
        break;
      }

      case 'fig.patch': {
        const fig = s.figures[op.id];
        if (!fig) break;
        this.state.saveHistory();
        Object.assign(fig, op.patch);
        fig.rev = (fig.rev || 0) + 1;
        this.state.notify('figures', { action: 'patch', figure: fig });
        break;
      }

      case 'fig.remove': {
        if (!s.figures[op.id]) break;
        this.state.saveHistory();
        delete s.figures[op.id];
        // Remove connected links
        for (const [lid, link] of Object.entries(s.links)) {
          if (link.from === op.id || link.to === op.id) {
            delete s.links[lid];
          }
        }
        if (this.state.ui.selectedFigureId === op.id) {
          this.state.ui.selectedFigureId = null;
        }
        this.state.notify('figures', { action: 'remove', id: op.id });
        break;
      }

      case 'link.add': {
        if (!op.link || !op.link.id) break;
        s.links[op.link.id] = op.link;
        this.state.notify('links', { action: 'add', link: op.link });
        break;
      }

      case 'link.remove': {
        if (!s.links[op.id]) break;
        delete s.links[op.id];
        this.state.notify('links', { action: 'remove', id: op.id });
        break;
      }

      case 'snap.add': {
        if (!op.snap) break;
        s.snapshots.push(op.snap);
        this.state.notify('snapshots', { action: 'add', snapshot: op.snap });
        break;
      }

      case 'session.patch': {
        if (!op.patch) break;
        Object.assign(s, op.patch);
        this.state.notify('session', op.patch);
        break;
      }

      case 'suggest': {
        // Coach suggests ghost placement
        this.state.setGhostSuggestion({
          id: op.id,
          x: op.x,
          y: op.y,
          angle: op.angle
        });
        break;
      }

      case 'suggest.respond': {
        const ghost = this.state.ui.ghostSuggestion;
        if (ghost && ghost.id === op.id) {
          if (op.accept && s.figures[op.id]) {
            // Apply suggestion as actual move
            this.dispatch({
              t: 'fig.move',
              id: ghost.id,
              x: ghost.x,
              y: ghost.y,
              angle: ghost.angle
            });
          }
          this.state.setGhostSuggestion(null);
        }
        break;
      }
    }
  }
}

    // Figure SVG Renderer: Shapes, Gaze Vectors, Rotation Handles, and Physical Image Skins
class FigureRenderer {
  static SIZES = {
    S: 22,
    M: 32,
    L: 44
  };

  static render(fig, isSelected = false, isGhost = false) {
    const r = this.SIZES[fig.size || 'M'] || 32;
    const opacity = isGhost ? 0.45 : (fig.released ? 0.4 : 1.0);
    const strokeDash = isGhost ? 'stroke-dasharray="4 4"' : '';
    const angle = fig.angle || 0;

    // SVG Group containing the figure, rotated around (0,0)
    let shapeSvg = '';

    if (fig.imageSrc) {
      // Physical Ball / Crystal Image Skin
      shapeSvg = `
        <image href="${fig.imageSrc}" x="${-r}" y="${-r}" width="${r * 2}" height="${r * 2}" preserveAspectRatio="xMidYMid meet" />
        <!-- Distinct Gaze Pointer for Images -->
        <path d="M 0 ${-r - 12} L -7 ${-r + 2} L 7 ${-r + 2} Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.5" filter="drop-shadow(0px 2px 3px rgba(0,0,0,0.4))" />
      `;
    } else {
      switch (fig.shape) {
        case 'person':
          shapeSvg = `
            <!-- Shoulders / Body -->
            <path d="M ${-r * 0.8} ${r * 0.75} C ${-r * 0.8} ${r * 0.2}, ${r * 0.8} ${r * 0.2}, ${r * 0.8} ${r * 0.75} Z" fill="${fig.color}" />
            <!-- Head -->
            <circle cx="0" cy="${-r * 0.15}" r="${r * 0.45}" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2" />
            <!-- Clear Nose / Gaze Indicator (Pointing to 12 o'clock) -->
            <path d="M 0 ${-r * 0.9} L -6 ${-r * 0.4} L 6 ${-r * 0.4} Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.2" />
          `;
          break;

        case 'circle':
          shapeSvg = `
            <circle cx="0" cy="0" r="${r * 0.75}" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2.5" />
            <!-- Gaze Arrow Pointer -->
            <path d="M 0 ${-r * 1.05} L -7 ${-r * 0.6} L 7 ${-r * 0.6} Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
          `;
          break;

        case 'square':
          shapeSvg = `
            <rect x="${-r * 0.7}" y="${-r * 0.7}" width="${r * 1.4}" height="${r * 1.4}" rx="${r * 0.25}" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2.5" />
            <path d="M 0 ${-r * 1.05} L -6 ${-r * 0.65} L 6 ${-r * 0.65} Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
          `;
          break;

        case 'star': {
          const outerR = r * 0.85;
          const innerR = r * 0.4;
          let points = [];
          for (let i = 0; i < 10; i++) {
            const rad = (i * Math.PI) / 5 - Math.PI / 2;
            const curR = i % 2 === 0 ? outerR : innerR;
            points.push(`${curR * Math.cos(rad)},${curR * Math.sin(rad)}`);
          }
          shapeSvg = `
            <polygon points="${points.join(' ')}" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2" />
            <path d="M 0 ${-r * 1.15} L -6 ${-r * 0.75} L 6 ${-r * 0.75} Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
          `;
          break;
        }

        case 'diamond':
          shapeSvg = `
            <polygon points="0,${-r * 0.9} ${r * 0.75},0 0,${r * 0.9} ${-r * 0.75},0" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2" />
            <path d="M 0 ${-r * 1.15} L -6 ${-r * 0.8} L 6 ${-r * 0.8} Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" />
          `;
          break;

        case 'observer':
          // Metaphoric Eye Symbol for Meta-Observer
          shapeSvg = `
            <path d="M ${-r * 0.9} 0 Q 0 ${-r * 0.7} ${r * 0.9} 0 Q 0 ${r * 0.7} ${-r * 0.9} 0 Z" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2.5" />
            <circle cx="0" cy="0" r="${r * 0.35}" fill="#FFFFFF" />
            <!-- Pupil looking forward -->
            <circle cx="0" cy="${-r * 0.1}" r="${r * 0.2}" fill="#0F172A" />
            <path d="M 0 ${-r * 1.05} L -6 ${-r * 0.65} L 6 ${-r * 0.65} Z" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
          `;
          break;

        default:
          shapeSvg = `<circle cx="0" cy="0" r="${r * 0.75}" fill="${fig.color}" stroke="#FFFFFF" stroke-width="2" />`;
      }
    }

    // Selection Ring and Rotation Knob
    let selectionOverlay = '';
    if (isSelected && !isGhost) {
      const knobDist = r + 24;
      selectionOverlay = `
        <!-- Selection Highlight Ring (Clean, static, tightly focused around figure) -->
        <circle cx="0" cy="0" r="${r + 8}" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3" opacity="0.9" />
        
        <!-- Rotation Stem & Knob (Interactive rotation handle) -->
        <line x1="0" y1="${-r - 5}" x2="0" y2="${-knobDist}" stroke="#3B82F6" stroke-width="2" />
        <circle cx="0" cy="${-knobDist}" r="7" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2" class="cursor-grab hover:scale-125 transition-transform" data-handle="rotate" />
      `;
    }

    // Label Badge rendered horizontally below the figure (doesn't rotate with angle so it remains easily readable)
    const labelText = fig.label || '피규어';
    const labelY = r + 18;

    return `
      <g id="fig-group-${fig.id}" class="figure-element cursor-move select-none" transform="translate(${fig.x}, ${fig.y})" data-id="${fig.id}" opacity="${opacity}">
        <!-- Rotatable Figure Core -->
        <g transform="rotate(${angle})" ${strokeDash}>
          ${shapeSvg}
          ${selectionOverlay}
        </g>

        <!-- Unrotated Text Label Pill (Always upright for clarity) -->
        <g transform="translate(0, ${labelY})" pointer-events="none">
          <rect x="${-labelText.length * 6 - 8}" y="-10" width="${labelText.length * 12 + 16}" height="20" rx="10" fill="rgba(15, 23, 42, 0.85)" />
          <text x="0" y="4" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600" font-family="'Pretendard', sans-serif">
            ${labelText}
          </text>
        </g>
      </g>
    `;
  }
}

    // Link & Distance Measurement Overlay
class LinkOverlay {
  static classifyDistance(dist) {
    if (dist < 150) return { level: 'near', text: '가까움' };
    if (dist <= 350) return { level: 'medium', text: '중간' };
    return { level: 'far', text: '멂' };
  }

  static renderLinks(links, figures) {
    let svg = '';

    for (const [id, link] of Object.entries(links)) {
      const fromFig = figures[link.from];
      const toFig = figures[link.to];
      if (!fromFig || !toFig) continue;

      const dx = toFig.x - fromFig.x;
      const dy = toFig.y - fromFig.y;
      const dist = Math.hypot(dx, dy);
      const midX = (fromFig.x + toFig.x) / 2;
      const midY = (fromFig.y + toFig.y) / 2;
      const distInfo = this.classifyDistance(dist);

      const color = link.color || '#6366F1';
      const marker = link.kind === 'arrow' ? 'url(#arrowhead-blue)' : '';

      svg += `
        <g id="link-${id}" class="link-element select-none" data-id="${id}">
          <line x1="${fromFig.x}" y1="${fromFig.y}" x2="${toFig.x}" y2="${toFig.y}" 
                stroke="${color}" stroke-width="2.5" stroke-dasharray="6 4" marker-end="${marker}" />
          <!-- Distance Pill Label with One-Click '×' Delete Button -->
          <g transform="translate(${midX}, ${midY})" pointer-events="auto" class="cursor-pointer link-label-group" data-link-id="${id}" title="클릭하여 관계선 삭제">
            <rect x="-42" y="-11" width="84" height="22" rx="11" fill="#FFFFFF" stroke="${color}" stroke-width="1.8" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.1))" />
            <text x="-8" y="4" text-anchor="middle" fill="#1E293B" font-size="10" font-weight="700">
              ${link.label || distInfo.text}
            </text>
            <!-- Delete X Button -->
            <g class="btn-delete-link hover:scale-125 transition-transform" transform="translate(26, 0)">
              <circle cx="0" cy="0" r="7" fill="#FEE2E2" stroke="#EF4444" stroke-width="1" />
              <text x="0" y="3" text-anchor="middle" fill="#EF4444" font-size="10" font-weight="900">&times;</text>
            </g>
          </g>
        </g>
      `;
    }

    return svg;
  }
}

    // Gesture Controller: Wheel Zoom, Pan, Drag, and Touch Pinch
class GestureController {
  constructor(canvasContainer, onTransformChange) {
    this.container = canvasContainer;
    this.onTransformChange = onTransformChange;
    this.zoom = 1.0;
    this.panX = 0;
    this.panY = 0;
    this.isPanning = false;
    this.startPanX = 0;
    this.startPanY = 0;

    this.initEvents();
  }

  initEvents() {
    // Wheel Zoom
    this.container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      const newZoom = Math.min(Math.max(this.zoom * zoomFactor, 0.4), 3.0);
      this.zoom = newZoom;
      this.triggerUpdate();
    }, { passive: false });

    // Middle click or Alt+Drag pan
    this.container.addEventListener('pointerdown', (e) => {
      if (e.button === 1 || (e.button === 0 && (e.altKey || e.target.id === 'boardBackground' || e.target.id === 'mainSvg'))) {
        this.isPanning = true;
        this.startPanX = e.clientX - this.panX;
        this.startPanY = e.clientY - this.panY;
        this.container.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!this.isPanning) return;
      this.panX = e.clientX - this.startPanX;
      this.panY = e.clientY - this.startPanY;
      this.triggerUpdate();
    });

    window.addEventListener('pointerup', () => {
      if (this.isPanning) {
        this.isPanning = false;
        this.container.style.cursor = 'default';
      }
    });
  }

  resetTransform() {
    this.zoom = 1.0;
    this.panX = 0;
    this.panY = 0;
    this.triggerUpdate();
  }

  triggerUpdate() {
    this.onTransformChange(this.zoom, this.panX, this.panY);
  }

  // Convert screen client coordinates to SVG logical coordinates (0~1000)
  screenToSvg(clientX, clientY, svgElem) {
    const rect = svgElem.getBoundingClientRect();
    const pt = svgElem.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const svgP = pt.matrixTransform(svgElem.getScreenCTM().inverse());
    return { x: Math.round(svgP.x), y: Math.round(svgP.y) };
  }
}

    
class BoardCanvas {
  constructor(containerElem, sessionState, hostAuthority) {
    this.container = containerElem;
    this.state = sessionState;
    this.authority = hostAuthority;

    // Interaction flags
    this.draggingFigId = null;
    this.rotatingFigId = null;
    this.dragStartPos = { x: 0, y: 0 };
    this.figStartPos = { x: 0, y: 0 };
    this.lastBroadcastTime = 0;
    this.snapToGrid = false;
    this.linkSourceFigId = null;

    this.renderSkeleton();
    this.gesture = new GestureController(this.container, (zoom, px, py) => {
      this.applyViewTransform(zoom, px, py);
    });

    this.bindPointerEvents();
    this.bindKeyboardShortcuts();

    // Subscribe to state changes
    this.state.subscribe(() => {
      this.render();
    });

    this.render();
  }

  renderSkeleton() {
    this.container.innerHTML = `
      <div id="boardViewport" class="relative w-full h-full overflow-hidden select-none bg-slate-50">
        <svg id="mainSvg" viewBox="0 0 1000 1000" class="w-full h-full pointer-events-auto">
          <defs>
            <filter id="tableShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.12" flood-color="#0F172A" />
            </filter>
            <filter id="figShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18" flood-color="#0F172A" />
            </filter>
            <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#6366F1" />
            </marker>
            <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
              <circle cx="20" cy="20" r="1" fill="#CBD5E1" opacity="0.6"/>
            </pattern>
          </defs>

          <!-- Canvas Transform Container Group -->
          <g id="canvasTransformGroup">
            <!-- Background Clickable Layer -->
            <rect id="boardBackground" x="-2000" y="-2000" width="5000" height="5000" fill="url(#gridPattern)" />

            <!-- Table Plate Layer -->
            <g id="tableLayer"></g>

            <!-- Waiting Zone (보류 존) -->
            <g id="waitingZoneLayer" transform="translate(100, 830)">
              <rect x="0" y="0" width="800" height="130" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 4" opacity="0.9" />
              <text x="24" y="26" fill="#64748B" font-size="12" font-weight="700" font-family="'Pretendard', sans-serif">
                📥 보류 존 (테이블 밖 대기 영역 / 내려놓은 짐)

            <!-- Connecting Lines Layer -->

            <!-- Figures Layer -->

    this.svg = this.container.querySelector('#mainSvg');
    this.transformGroup = this.container.querySelector('#canvasTransformGroup');
    this.tableLayer = this.container.querySelector('#tableLayer');

    this.figuresLayer = this.container.querySelector('#figuresLayer');
    this.ghostLayer = this.container.querySelector('#ghostLayer');
  }

  applyViewTransform(zoom, px, py) {
    this.transformGroup.setAttribute('transform', `translate(${px}, ${py}) scale(${zoom})`);
  }

  render() {
    this.renderTableSkin();
    this.renderLinks();
    this.renderFigures();
    this.renderGhost();
  }

  renderTableSkin() {
    const skin = this.state.session.tableSkin || 'round_wood';
    let html = '';

    switch (skin) {
      case 'round_wood':
        html = `
          <!-- Circular Wood Dish Table -->
          <image href="./assets/figures/table_wood_round_1.png" x="120" y="60" width="760" height="740" preserveAspectRatio="xMidYMid meet" filter="url(#tableShadow)" />

        `;
        break;

      case 'square_areca':
        html = `
          <!-- Square Areca Plate Table -->
          <image href="./assets/figures/table_square_areca.png" x="130" y="70" width="740" height="720" preserveAspectRatio="xMidYMid meet" filter="url(#tableShadow)" />
          <circle cx="500" cy="430" r="3" fill="#78350F" opacity="0.4" />
        `;
        break;

      case 'plate_basic':
        html = `
          <image href="./assets/figures/table_plate_basic.png" x="140" y="80" width="720" height="700" preserveAspectRatio="xMidYMid meet" filter="url(#tableShadow)" />
        `;
        break;

      default:
        // Clean Minimal SVG Round Table
        html = `
          <circle cx="500" cy="430" r="360" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" filter="url(#tableShadow)" />
          <circle cx="500" cy="430" r="340" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="2" />
          <circle cx="500" cy="430" r="4" fill="#94A3B8" opacity="0.5" />
          <!-- Subtle Cardinal Guide Marks -->
          <line x1="500" y1="90" x2="500" y2="110" stroke="#CBD5E1" stroke-width="2" />
          <line x1="500" y1="750" x2="500" y2="770" stroke="#CBD5E1" stroke-width="2" />
          <line x1="160" y1="430" x2="180" y2="430" stroke="#CBD5E1" stroke-width="2" />
          <line x1="820" y1="430" x2="840" y2="430" stroke="#CBD5E1" stroke-width="2" />
        `;
    }

    this.tableLayer.innerHTML = html;
  }

  renderLinks() {
    this.linksLayer.innerHTML = LinkOverlay.renderLinks(this.state.session.links, this.state.session.figures);
  }

  renderFigures() {
    const selectedId = this.state.ui.selectedFigureId;
    let html = '';

    for (const [id, fig] of Object.entries(this.state.session.figures)) {
      html += FigureRenderer.render(fig, id === selectedId, false);
    }

    this.figuresLayer.innerHTML = html;
  }

  renderGhost() {
    const ghost = this.state.ui.ghostSuggestion;
    if (!ghost || !this.state.session.figures[ghost.id]) {
      this.ghostLayer.innerHTML = '';
      return;
    }

    const baseFig = this.state.session.figures[ghost.id];
    const ghostFig = { ...baseFig, x: ghost.x, y: ghost.y, angle: ghost.angle || baseFig.angle };
    this.ghostLayer.innerHTML = FigureRenderer.render(ghostFig, false, true);
  }

  // --- Interaction & Event Binding ---
  bindPointerEvents() {
    this.svg.addEventListener('pointerdown', (e) => {
      // If locked, prevent interaction
      if (this.state.session.locked || this.state.session.paused) return;

      const targetHandle = e.target.getAttribute('data-handle');
      const figureGroup = e.target.closest('.figure-element');

      if (targetHandle === 'rotate' && figureGroup) {
        // Start rotation
        const figId = figureGroup.getAttribute('data-id');
        this.rotatingFigId = figId;
        this.svg.setPointerCapture(e.pointerId);
        e.stopPropagation();
        return;
      }

      if (figureGroup) {
        const figId = figureGroup.getAttribute('data-id');

        // Line creation tool handling
        if (this.state.ui.activeTool === 'link') {
          if (!this.linkSourceFigId) {
            this.linkSourceFigId = figId;
            this.state.setSelectedFigure(figId);
          } else if (this.linkSourceFigId !== figId) {
            // Create link between linkSourceFigId and figId
            const newLinkId = `link-${Date.now()}`;
            this.authority.dispatch({
              t: 'link.add',
              link: {
                id: newLinkId,
                from: this.linkSourceFigId,
                to: figId,
                kind: 'arrow',
                color: '#6366F1'
              }
            });
            this.linkSourceFigId = null;
            this.state.ui.activeTool = 'select';
          }
          return;
        }

        // Start figure drag
        this.draggingFigId = figId;
        this.state.setSelectedFigure(figId);
        const pt = this.gesture.screenToSvg(e.clientX, e.clientY, this.svg);
        this.dragStartPos = pt;
        const fig = this.state.getFigure(figId);
        if (fig) {
          this.figStartPos = { x: fig.x, y: fig.y };
        }
        this.svg.setPointerCapture(e.pointerId);
        e.stopPropagation();
        return;
      }

      // Check if user clicked a link delete button or link label
      const linkGroup = e.target.closest('.link-label-group');
      if (linkGroup) {
        const linkId = linkGroup.getAttribute('data-link-id');
        if (linkId) {
          this.authority.dispatch({
            t: 'link.remove',
            id: linkId
          });
        }
        e.stopPropagation();
        return;
      }

      // Background click: deselect
      if (e.target.id === 'boardBackground') {
        this.state.setSelectedFigure(null);
        this.linkSourceFigId = null;
      }
    });

    this.svg.addEventListener('pointermove', (e) => {
      if (this.rotatingFigId) {
        const fig = this.state.getFigure(this.rotatingFigId);
        if (!fig) return;

        const pt = this.gesture.screenToSvg(e.clientX, e.clientY, this.svg);
        const dx = pt.x - fig.x;
        const dy = pt.y - fig.y;
        // Angle in degrees: 0 = 12 o'clock, clockwise
        let angleDeg = Math.round((Math.atan2(dx, -dy) * 180) / Math.PI);
        if (angleDeg < 0) angleDeg += 360;

        fig.angle = angleDeg;
        this.renderFigures();

        // Throttled broadcast (every 60ms)
        const now = Date.now();
        if (now - this.lastBroadcastTime > 60) {
          this.lastBroadcastTime = now;
          this.authority.dispatch({
            t: 'fig.move',
            id: fig.id,
            x: fig.x,
            y: fig.y,
            angle: angleDeg,
            rev: fig.rev
          });
        }
        return;
      }

      if (this.draggingFigId) {
        const fig = this.state.getFigure(this.draggingFigId);
        if (!fig || fig.locked) return;

        const pt = this.gesture.screenToSvg(e.clientX, e.clientY, this.svg);
        let newX = this.figStartPos.x + (pt.x - this.dragStartPos.x);
        let newY = this.figStartPos.y + (pt.y - this.dragStartPos.y);

        if (this.snapToGrid) {
          newX = Math.round(newX / 25) * 25;
          newY = Math.round(newY / 25) * 25;
        }

        // Zone detection: y >= 830 is waiting zone
        const zone = newY >= 830 ? 'waiting' : 'table';

        fig.x = newX;
        fig.y = newY;
        fig.zone = zone;
        this.renderFigures();
        this.renderLinks();

        // Throttled broadcast
        const now = Date.now();
        if (now - this.lastBroadcastTime > 50) {
          this.lastBroadcastTime = now;
          this.authority.dispatch({
            t: 'fig.move',
            id: fig.id,
            x: newX,
            y: newY,
            angle: fig.angle,
            zone: zone,
            rev: fig.rev
          });
        }
      }
    });

    const endDragOrRotate = () => {
      if (this.rotatingFigId) {
        const fig = this.state.getFigure(this.rotatingFigId);
        if (fig) {
          // Final confirmed broadcast
          this.authority.dispatch({
            t: 'fig.move',
            id: fig.id,
            x: fig.x,
            y: fig.y,
            angle: fig.angle,
            rev: fig.rev
          });
        }
        this.rotatingFigId = null;
      }

      if (this.draggingFigId) {
        const fig = this.state.getFigure(this.draggingFigId);
        if (fig) {
          // Final confirmed broadcast
          this.authority.dispatch({
            t: 'fig.move',
            id: fig.id,
            x: fig.x,
            y: fig.y,
            angle: fig.angle,
            zone: fig.zone,
            rev: fig.rev
          });
        }
        this.draggingFigId = null;
      }
    };

    this.svg.addEventListener('pointerup', endDragOrRotate);
    this.svg.addEventListener('pointercancel', endDragOrRotate);
  }

  bindKeyboardShortcuts() {
    window.addEventListener('keydown', (e) => {
      // Ignore if typing in text inputs
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      const selectedId = this.state.ui.selectedFigureId;
      if (!selectedId) return;
      const fig = this.state.getFigure(selectedId);
      if (!fig) return;

      // Q / E: Rotate 15 degrees
      if (e.key === 'q' || e.key === 'Q') {
        const newAngle = (fig.angle - 15 + 360) % 360;
        this.authority.dispatch({ t: 'fig.move', id: fig.id, x: fig.x, y: fig.y, angle: newAngle });
      } else if (e.key === 'e' || e.key === 'E') {
        const newAngle = (fig.angle + 15) % 360;
        this.authority.dispatch({ t: 'fig.move', id: fig.id, x: fig.x, y: fig.y, angle: newAngle });
      }

      // Arrow keys: fine move (5px)
      if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        const step = e.shiftKey ? 20 : 5;
        let nx = fig.x;
        let ny = fig.y;
        if (e.key === 'ArrowUp') ny -= step;
        if (e.key === 'ArrowDown') ny += step;
        if (e.key === 'ArrowLeft') nx -= step;
        if (e.key === 'ArrowRight') nx += step;
        this.authority.dispatch({ t: 'fig.move', id: fig.id, x: nx, y: ny, angle: fig.angle });
      }

      // Delete / Backspace: remove
      if (e.key === 'Delete') {
        this.authority.dispatch({ t: 'fig.remove', id: fig.id });
      }
    });
  }
}

  updateStageDisplay() {
    const curStageIdx = this.state.session.stage || 0;
    const stageData = this.stages[curStageIdx] || this.stages[0];
    if (!stageData) return;

    const badge = this.container.querySelector('#guideStageBadge');
    const time = this.container.querySelector('#guideStageTime');
    const desc = this.container.querySelector('#guideStageDesc');
    const keyQ = this.container.querySelector('#guideKeyQuestion');

      container.innerHTML = `

          <div class="border border-amber-200 bg-amber-50/50 rounded-lg p-2">

          </div>
          <div class="border border-indigo-200 bg-indigo-50/50 rounded-lg p-2">
            <span class="font-bold text-indigo-800 block mb-1">3. 순서와 위계(Order)의 렌즈</span>
            <p class="text-indigo-900">${(l.order || [])[0] || ''}</p>
          </div>
        </div>
      `;
    } else if (tabName === 'interventions') {
      const items = this.questions.interventions || [];
      container.innerHTML = `
        <div class="space-y-2">
          ${items.map(it => `
            <div class="border border-slate-200 rounded-lg p-2 bg-white shadow-2xs">

              <p class="text-slate-600 leading-relaxed">${it.guide}</p>

      container.innerHTML = `
        <div class="space-y-2">
          <p class="text-slate-500 text-[11px]">주제에 맞는 템플릿을 선택하면 보드에 요소가 자동 배치됩니다.</p>
          ${this.templates.map(tpl => `
            <div class="border border-slate-200 hover:border-blue-400 p-2 rounded-lg bg-white cursor-pointer transition" data-template-id="${tpl.id}">
              <div class="flex items-center justify-between mb-1">
                <span class="font-bold text-slate-800">${tpl.title}</span>
                <span class="text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-bold">${tpl.elements.length}개 요소</span>
              </div>
              <p class="text-slate-500 text-[11px]">${tpl.description}</p>
            </div>
          `).join('')}
        </div>
      `;
    }
  }

  bindEvents() {
    const toggleBtn = this.container.querySelector('#guideToggleBtn');
    const header = this.container.querySelector('#guideHeader');
    const body = this.container.querySelector('#guideBody');

    const toggle = () => {
      body.classList.toggle('hidden');
      toggleBtn.textContent = body.classList.contains('hidden') ? '▲' : '▼';
    };

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggle();
    });
    header.addEventListener('click', toggle);

    // Stage Next/Prev
    this.container.querySelector('#btnNextStage')?.addEventListener('click', () => {
      const cur = this.state.session.stage || 0;
      if (cur < this.stages.length - 1) {
        this.authority.dispatch({
          t: 'session.patch',
          patch: { stage: cur + 1 }
        });
      }
    });

    this.container.querySelector('#btnPrevStage')?.addEventListener('click', () => {
      const cur = this.state.session.stage || 0;
      if (cur > 0) {
        this.authority.dispatch({
          t: 'session.patch',
          patch: { stage: cur - 1 }
        });
      }
    });

    // Tab buttons
    this.container.querySelectorAll('.guide-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this.container.querySelectorAll('.guide-tab-btn').forEach(b => {
          b.classList.remove('bg-white', 'text-blue-700', 'shadow-2xs');
          b.classList.add('text-slate-600');
        });
        btn.classList.add('bg-white', 'text-blue-700', 'shadow-2xs');
        btn.classList.remove('text-slate-600');
        this.renderTabContent(btn.getAttribute('data-tab'));
      });
    });

    // Template item click delegation
    this.container.addEventListener('click', (e) => {
      const tplItem = e.target.closest('[data-template-id]');
      if (tplItem) {
        const tplId = tplItem.getAttribute('data-template-id');
        const tpl = this.templates.find(t => t.id === tplId);
        if (tpl && confirm(`'${tpl.title}' 템플릿을 보드에 불러오시겠습니까? 기존 배치는 초기화됩니다.`)) {
          const newFigs = {};
          tpl.elements.forEach((el, idx) => {
            const id = `fig-${Date.now()}-${idx}`;
            newFigs[id] = {
              id,
              label: el.label,
              shape: el.shape || 'circle',
              color: el.color || '#3B82F6',
              size: el.size || 'M',
              x: el.x,
              y: el.y,
              angle: el.angle || 0,
              zone: el.zone || 'table',
              locked: false,
              perspectiveNote: '',
              tags: [],
              sentences: [],
              released: false,
              rev: 1
            };
          });

          this.authority.dispatch({
            t: 'session.patch',
            patch: {
              templateId: tplId,
              figures: newFigs,
              links: {}
            }
          });
        }
      }
    });
  }
}

  bindEvents() {
    // Consent Agreement
    const consentCb = document.getElementById('consentCheckbox');
    const enterBtn = document.getElementById('btnEnterSession');
    const consentModal = document.getElementById('consentModalOverlay');

    consentCb?.addEventListener('change', () => {
      if (consentCb.checked) {
        enterBtn.disabled = false;
        enterBtn.className = 'w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition cursor-pointer';
      } else {
        enterBtn.disabled = true;
        enterBtn.className = 'w-full py-2.5 bg-slate-300 text-slate-500 font-bold text-xs rounded-xl transition cursor-not-allowed';
      }
    });

    enterBtn?.addEventListener('click', () => {
      consentModal.classList.add('hidden');
      const role = this.state.role;
      const patchConsent = { ...this.state.session.consent, [role]: true };
      this.authority.dispatch({
        t: 'session.patch',
        patch: { consent: patchConsent }
      });
    });

    // Pause Resume
    const pauseModal = document.getElementById('pauseModalOverlay');
    const resumeBtn = document.getElementById('btnResumeSession');
    resumeBtn?.addEventListener('click', () => {
      this.authority.dispatch({
        t: 'session.patch',
        patch: { paused: false }
      });
    });

    // Deroling Close & Release All
    const derolingModal = document.getElementById('derolingModalOverlay');
    document.getElementById('btnCloseDeroling')?.addEventListener('click', () => {
      derolingModal.classList.add('hidden');
    });

    document.getElementById('btnReleaseAllFigures')?.addEventListener('click', () => {
      const figs = this.state.session.figures;
      for (const [id, f] of Object.entries(figs)) {
        this.authority.dispatch({
          t: 'fig.patch',
          id,
          patch: { released: true, zone: 'waiting', y: 880 }
        });
      }
      alert('모든 피규어의 역할이 해제되어 보류 존으로 이동했습니다.');
    });

    document.getElementById('btnCompleteDeroling')?.addEventListener('click', () => {
      const commitment = document.getElementById('derolingCommitmentInput').value;
      if (commitment) {
        this.authority.dispatch({
          t: 'session.patch',
          patch: { commitment }
        });
      }
      derolingModal.classList.add('hidden');
      // Trigger report download
      if (window.exportManager) {
        window.exportManager.exportMarkdownReport();
      }
    });

    // Crisis Close
    const crisisModal = document.getElementById('crisisModalOverlay');
    document.getElementById('btnCloseCrisis')?.addEventListener('click', () => {
      crisisModal.classList.add('hidden');
    });

    // Listen to session state for pause toggle
    this.state.subscribe((session, ui, changeType) => {
      if (changeType === 'session') {
        if (session.paused) {
          pauseModal.classList.remove('hidden');
        } else {
          pauseModal.classList.add('hidden');
        }
      }
    });
  }

  showPause() {
    this.authority.dispatch({
      t: 'session.patch',
      patch: { paused: true }
    });
  }

  showDeroling() {
    document.getElementById('derolingModalOverlay').classList.remove('hidden');
  }

  showCrisis() {
    document.getElementById('crisisModalOverlay').classList.remove('hidden');
  }
}

    // Session Export Manager: PNG Canvas, JSON Backup/Restore, Markdown Report
class ExportManager {
  constructor(sessionState) {
    this.state = sessionState;
  }

  // 1. Export High-Res PNG from SVG
  async exportPng() {
    const svgElem = document.getElementById('mainSvg');
    if (!svgElem) return;

    try {
      const svgClone = svgElem.cloneNode(true);
      // Clean up transform on clone for direct 1000x1000 export
      const gTransform = svgClone.querySelector('#canvasTransformGroup');
      if (gTransform) gTransform.removeAttribute('transform');

      const svgData = new XMLSerializer().serializeToString(svgClone);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 1200;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#F8FAFC';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);

        canvas.toBlob((blob) => {
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.download = `table-constellation-${this.state.roomId}-${dateStr}.png`;
          a.href = URL.createObjectURL(blob);
          a.click();
        }, 'image/png');
      };
      img.src = url;
    } catch (err) {
      console.error('PNG export failed:', err);
      alert('이미지 내보내기 중 오류가 발생했습니다.');
    }
  }

  // 2. Export Session JSON
  exportJson() {
    const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(this.state.session, null, 2));
    const a = document.createElement('a');
    a.setAttribute('href', dataStr);
    a.setAttribute('download', `constellation-${this.state.roomId}-backup.json`);
    a.click();
  }

  // 3. Import Session JSON
  importJson(file, authority) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed && parsed.schemaVersion === 1) {
          authority.dispatch({
            t: 'session.patch',
            patch: parsed
          });
          alert('세션 데이터를 성공적으로 불러왔습니다.');
        } else {
          alert('올바른 세션 JSON 파일 형식이 아닙니다.');
        }
      } catch (err) {
        alert('파일을 읽는 중 오류가 발생했습니다.');
      }
    };
    reader.readAsText(file);
  }

  // 4. Export Markdown Structured Coaching Report
  exportMarkdownReport() {
    const s = this.state.session;
    const dateStr = new Date().toLocaleString('ko-KR');

    let md = `# [세션 리포트] 1:1 테이블 컨스텔레이션 코칭 기록\n\n`;
    md += `> **세션 일시:** ${dateStr}  \n`;
    md += `> **룸 ID:** \`${s.roomId}\`  \n`;
    md += `> **진행 템플릿:** ${s.templateId}  \n\n`;

    md += `## 1. 코칭 주제 및 목표 질문\n`;
    md += `> "${s.topic || '자유 탐색'}"\n\n`;

    md += `## 2. 배치된 핵심 요소 및 관점 기록\n\n`;
    md += `| 피규어 라벨 | 형태 | 크기 | 위치(X,Y) | 시선 각도 | 상태/영역 |\n`;
    md += `|---|---|---|---|---|---|\n`;

    const figuresList = Object.values(s.figures);
    for (const fig of figuresList) {
      const zoneName = fig.zone === 'table' ? '테이블 위' : '보류 존(대기)';
      md += `| **${fig.label}** | ${fig.shape} | ${fig.size} | (${fig.x}, ${fig.y}) | ${fig.angle}° | ${zoneName} |\n`;
    }
    md += `\n`;

    md += `### 피규어별 관점 메모 (내면의 소리)\n\n`;
    let hasNotes = false;
    for (const fig of figuresList) {
      if (fig.perspectiveNote || (fig.tags && fig.tags.length > 0)) {
        hasNotes = true;
        md += `#### ✦ ${fig.label}\n`;
        if (fig.tags && fig.tags.length > 0) {
          md += `- **신체감각/감정 태그:** \`${fig.tags.join('`, `')}\`\n`;
        }
        if (fig.perspectiveNote) {
          md += `- **관점 메모:** "${fig.perspectiveNote}"\n`;
        }
        md += `\n`;
      }
    }
    if (!hasNotes) {
      md += `*작성된 관점 메모가 없습니다.*\n\n`;
    }

    md += `## 3. 세션 중 시도된 해결 문장 (Sentences)\n\n`;
    let sentenceCount = 0;
    for (const fig of figuresList) {
      if (fig.sentences && fig.sentences.length > 0) {
        for (const sent of fig.sentences) {
          sentenceCount++;
          md += `- **[${fig.label}를 향하여]** "${sent.text}"\n`;
        }
      }
    }
    if (sentenceCount === 0) {
      md += `*기록된 해결 문장이 없습니다.*\n\n`;
    }

    md += `## 4. 최종 해결 이미지 및 스냅샷\n`;
    md += `- 기록된 스냅샷 수: **${s.snapshots.length}개**\n`;
    s.snapshots.forEach((snap, idx) => {
      md += `  - [스냅샷 ${idx + 1}] ${snap.name} (${snap.at})\n`;
    });
    md += `\n`;

    md += `## 5. 일상에서의 실천 과제 (Commitment)\n`;
    md += `> "${s.commitment || '자유로운 일상 복귀 및 관찰'}"\n\n`;

    md += `---\n`;
    md += `*본 리포트는 개인정보 보호 원칙에 따라 서버에 저장되지 않고 사용자 로컬에 직접 생성되었습니다.*\n`;

    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `table-constellation-report-${s.roomId}-${new Date().toISOString().slice(0, 10)}.md`;
    a.click();
  }
}

  setupSyncStatusListener() {
    const badge = document.getElementById('statusBadge');
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');

    const mBadge = document.getElementById('mobileStatusBadge');
    const mDot = document.getElementById('mobileStatusDot');
    const mText = document.getElementById('mobileStatusText');

    this.sync.onStatusChange((status, msg) => {
      const updatePill = (b, d, t, isMobile) => {
        if (!b || !d || !t) return;
        t.textContent = isMobile ? (status === 'connected' ? '연결됨' : (status === 'waiting' ? '대기 중' : '재연결 중')) : (msg || status);

        switch (status) {
          case 'connected':
            b.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200';
            d.className = 'w-2 h-2 rounded-full bg-emerald-500';
            break;
          case 'waiting':
          case 'connecting':
          case 'reconnecting':
            b.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200';
            d.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
            break;
          case 'disconnected':
          case 'error':
            b.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200';
            d.className = 'w-2 h-2 rounded-full bg-rose-500';
            break;
        }
      };

      updatePill(badge, dot, text, false);
      updatePill(mBadge, mDot, mText, true);
    });
  }

  bindMobileDrawerEvents() {
    // Palette Drawer
    const paletteDrawer = document.getElementById('paletteDrawer');
    const paletteBackdrop = document.getElementById('paletteBackdrop');
    const btnOpenPalette = document.getElementById('btnTogglePaletteDrawer');
    const btnClosePalette = document.getElementById('btnClosePaletteDrawer');

    const openPalette = () => {
      paletteDrawer.classList.remove('-translate-x-full');
      paletteBackdrop.classList.remove('hidden');
    };
    const closePalette = () => {
      paletteDrawer.classList.add('-translate-x-full');
      paletteBackdrop.classList.add('hidden');
    };

    btnOpenPalette?.addEventListener('click', openPalette);
    btnClosePalette?.addEventListener('click', closePalette);
    paletteBackdrop?.addEventListener('click', closePalette);

    // Close palette automatically when any figure item is clicked on mobile
    paletteDrawer?.querySelectorAll('.palette-item, .palette-img-item').forEach(btn => {
      btn.addEventListener('click', () => {
        if (window.innerWidth < 768) closePalette();
      });
    });

    // Inspector Drawer
    const inspectorDrawer = document.getElementById('inspectorDrawer');
    const inspectorBackdrop = document.getElementById('inspectorBackdrop');
    const btnOpenInspector = document.getElementById('btnToggleInspectorDrawer');
    const btnCloseInspector = document.getElementById('btnCloseInspectorDrawer');

    const openInspector = () => {
      inspectorDrawer.classList.remove('translate-x-full');
      inspectorBackdrop.classList.remove('hidden');
    };
    const closeInspector = () => {
      inspectorDrawer.classList.add('translate-x-full');
      inspectorBackdrop.classList.add('hidden');
    };

    btnOpenInspector?.addEventListener('click', openInspector);
    btnCloseInspector?.addEventListener('click', closeInspector);
    inspectorBackdrop?.addEventListener('click', closeInspector);

    // Auto-open inspector drawer on mobile when figure is selected
    this.state.subscribe((session, ui, changeType) => {
      if (changeType === 'select') {
        if (ui.selectedFigureId && window.innerWidth < 768) {
          openInspector();
        }
      }
    });

    // Mobile Timeline Modal
    const timelineModal = document.getElementById('mobileTimelineModal');
    const btnOpenTimeline = document.getElementById('btnToggleTimelineDrawer');
    const btnCloseTimeline = document.getElementById('btnCloseMobileTimeline');
    btnOpenTimeline?.addEventListener('click', () => timelineModal.classList.remove('hidden'));
    btnCloseTimeline?.addEventListener('click', () => timelineModal.classList.add('hidden'));

    // Mobile Copy Invite
    document.getElementById('btnMobileCopyInvite')?.addEventListener('click', () => {
      const clientUrl = `${window.location.origin}${window.location.pathname}#/room/${this.roomId}?role=client`;
      navigator.clipboard.writeText(clientUrl).then(() => {
        alert(`고객 전용 초대 링크가 복사되었습니다:\n${clientUrl}`);
      });
    });

    // Mobile Pause & Finish
    document.getElementById('btnMobilePause')?.addEventListener('click', () => this.safety.showPause());
    document.getElementById('btnMobileFinish')?.addEventListener('click', () => this.safety.showDeroling());

    // Mobile Topic
    const mobileTopicInput = document.getElementById('mobileTopicInput');
    mobileTopicInput?.addEventListener('change', () => {
      this.authority.dispatch({
        t: 'session.patch',
        patch: { topic: mobileTopicInput.value }
      });
    });

    this.state.subscribe((session, ui, changeType) => {
      if (changeType === 'session') {
        if (mobileTopicInput && document.activeElement !== mobileTopicInput) {
          mobileTopicInput.value = session.topic || '';
        }
      }
    });
  }

  bindTopBarEvents() {
    document.getElementById('btnCopyInvite')?.addEventListener('click', () => {
      const clientUrl = `${window.location.origin}${window.location.pathname}#/room/${this.roomId}?role=client`;
      navigator.clipboard.writeText(clientUrl).then(() => {
        alert(`고객 전용 초대 링크가 복사되었습니다:\n${clientUrl}`);
      });
    });

    const topicInput = document.getElementById('topicInput');
    topicInput?.addEventListener('change', () => {
      this.authority.dispatch({
        t: 'session.patch',
        patch: { topic: topicInput.value }
      });
    });

    const skinSelect = document.getElementById('skinSelect');
    skinSelect?.addEventListener('change', () => {
      this.authority.dispatch({
        t: 'session.patch',
        patch: { tableSkin: skinSelect.value }
      });
    });

    document.getElementById('btnUndo')?.addEventListener('click', () => this.state.undo());
    document.getElementById('btnRedo')?.addEventListener('click', () => this.state.redo());

    document.getElementById('btnExportPng')?.addEventListener('click', () => this.exporter.exportPng());
    document.getElementById('btnExportReport')?.addEventListener('click', () => this.exporter.exportMarkdownReport());

    document.getElementById('btnPause')?.addEventListener('click', () => this.safety.showPause());
    document.getElementById('btnFinishSession')?.addEventListener('click', () => this.safety.showDeroling());

    this.state.subscribe((session, ui, changeType) => {
      if (changeType === 'session') {
        if (topicInput && document.activeElement !== topicInput) {
          topicInput.value = session.topic || '';
        }
        if (skinSelect) {
          skinSelect.value = session.tableSkin || 'round_wood';
        }
      }
    });
  }

  bindPaletteEvents() {
    const tabSvg = document.getElementById('paletteTabSvg');
    const tabImg = document.getElementById('paletteTabImg');
    const secSvg = document.getElementById('paletteSvgSection');
    const secImg = document.getElementById('paletteImgSection');

    tabSvg?.addEventListener('click', () => {
      tabSvg.className = 'flex-1 py-1 rounded-md bg-white text-blue-700 shadow-2xs';
      tabImg.className = 'flex-1 py-1 rounded-md text-slate-600';
      secSvg.classList.remove('hidden');
      secImg.classList.add('hidden');
    });

    tabImg?.addEventListener('click', () => {
      tabImg.className = 'flex-1 py-1 rounded-md bg-white text-blue-700 shadow-2xs';
      tabSvg.className = 'flex-1 py-1 rounded-md text-slate-600';
      secImg.classList.remove('hidden');
      secSvg.classList.add('hidden');
    });

    document.querySelectorAll('.palette-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const shape = btn.getAttribute('data-shape');
        const id = `fig-${Date.now()}`;
        const defaultNames = {
          person: '사람',
          circle: '요소',
          square: '상황',
          star: '목표',
          diamond: '자원',
          observer: '관찰자'
        };

        this.authority.dispatch({
          t: 'fig.add',
          fig: {
            id,
            label: defaultNames[shape] || '피규어',
            shape,
            color: '#3B82F6',
            size: 'M',
            x: 500,
            y: 430,
            angle: 0,
            zone: 'table',
            locked: false,
            perspectiveNote: '',
            tags: [],
            sentences: [],
            released: false,
            rev: 1
          }
        });
        this.state.setSelectedFigure(id);
      });
    });

    document.querySelectorAll('.palette-img-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const imgSrc = btn.getAttribute('data-img');
        const label = btn.getAttribute('data-label') || '구슬';
        const id = `fig-${Date.now()}`;

        this.authority.dispatch({
          t: 'fig.add',
          fig: {
            id,
            label,
            shape: 'image_custom',
            imageSrc: imgSrc,
            color: '#6366F1',
            size: 'M',
            x: 500,
            y: 430,
            angle: 0,
            zone: 'table',
            locked: false,
            perspectiveNote: '',
            tags: [],
            sentences: [],
            released: false,
            rev: 1
          }
        });
        this.state.setSelectedFigure(id);
      });
    });

    const btnToolLink = document.getElementById('btnToolLink');
    btnToolLink?.addEventListener('click', () => {
      if (this.state.ui.activeTool === 'link') {
        this.state.ui.activeTool = 'select';
        btnToolLink.className = 'w-full py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl flex items-center justify-center space-x-1.5 transition';
      } else {
        this.state.ui.activeTool = 'link';
        btnToolLink.className = 'w-full py-2 px-3 bg-blue-600 text-white font-bold text-xs rounded-xl flex items-center justify-center space-x-1.5 transition shadow-sm';
      }
    });

    const cbSnapGrid = document.getElementById('cbSnapGrid');
    cbSnapGrid?.addEventListener('change', () => {
      if (this.board) this.board.snapToGrid = cbSnapGrid.checked;
    });
  }

  bindInspectorEvents() {
    const emptyState = document.getElementById('inspectorEmptyState');
    const activeState = document.getElementById('inspectorActiveState');
    const propId = document.getElementById('inspectorFigId');
    const propLabel = document.getElementById('propLabel');
    const propAngleRange = document.getElementById('propAngleRange');
    const propAngleVal = document.getElementById('propAngleVal');
    const propPerspectiveNote = document.getElementById('propPerspectiveNote');
    const colorContainer = document.getElementById('colorPaletteContainer');
    const tagsContainer = document.getElementById('tagsListContainer');
    const sentencesContainer = document.getElementById('sentencesContainer');
    const btnToggleZone = document.getElementById('btnToggleZone');
    const btnDeleteFig = document.getElementById('btnDeleteFig');

    const colors = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899', '#06B6D4', '#475569'];
    colorContainer.innerHTML = colors.map(c => `
      <button class="w-7 h-7 rounded-full border-2 border-white shadow-2xs hover:scale-110 transition color-chip" data-color="${c}" style="background-color: ${c}"></button>
    `).join('');

    const updateInspector = () => {
      const fig = this.state.getSelectedFigure();
      if (!fig) {
        emptyState.classList.remove('hidden');
        activeState.classList.add('hidden');
        propId.textContent = '선택 없음';
        return;
      }

      emptyState.classList.add('hidden');
      activeState.classList.remove('hidden');
      propId.textContent = `#${fig.id}`;
      propLabel.value = fig.label || '';
      propAngleRange.value = fig.angle || 0;
      propAngleVal.textContent = `${fig.angle || 0}°`;
      propPerspectiveNote.value = fig.perspectiveNote || '';
      btnToggleZone.textContent = fig.zone === 'table' ? '보류 존으로 내리기' : '테이블로 올리기';

      document.querySelectorAll('.prop-size-btn').forEach(b => {
        if (b.getAttribute('data-size') === fig.size) {
          b.className = 'prop-size-btn flex-1 py-1.5 rounded-lg border border-blue-500 bg-blue-50 text-blue-700 font-bold';
        } else {
          b.className = 'prop-size-btn flex-1 py-1.5 rounded-lg border border-slate-200 text-slate-700 font-bold';
        }
      });

      tagsContainer.innerHTML = (fig.tags || []).map((t, idx) => `
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 border border-slate-200">
          ${t}
          <button class="ml-1 text-slate-400 hover:text-rose-500" data-remove-tag="${idx}">&times;</button>
        </span>
      `).join('');

      sentencesContainer.innerHTML = (fig.sentences || []).map((s, idx) => `
        <div class="p-2 bg-blue-50/50 border border-blue-100 rounded-lg text-slate-800 text-[11px] flex items-center justify-between">
          <span>"${s.text}"</span>
          <button class="text-slate-400 hover:text-rose-500 font-bold" data-remove-sentence="${idx}">&times;</button>
        </div>
      `).join('');
    };

    propLabel?.addEventListener('input', () => {
      const fig = this.state.getSelectedFigure();
      if (fig) {
        this.authority.dispatch({
          t: 'fig.patch',
          id: fig.id,
          patch: { label: propLabel.value }
        });
      }
    });

    propAngleRange?.addEventListener('input', () => {
      const fig = this.state.getSelectedFigure();
      if (fig) {
        const val = parseInt(propAngleRange.value, 10);
        propAngleVal.textContent = `${val}°`;
        this.authority.dispatch({
          t: 'fig.move',
          id: fig.id,
          x: fig.x,
          y: fig.y,
          angle: val
        });
      }
    });

    document.querySelectorAll('.prop-size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const fig = this.state.getSelectedFigure();
        if (fig) {
          this.authority.dispatch({
            t: 'fig.patch',
            id: fig.id,
            patch: { size: btn.getAttribute('data-size') }
          });
        }
      });
    });

    colorContainer.addEventListener('click', (e) => {
      const chip = e.target.closest('.color-chip');
      if (chip) {
        const fig = this.state.getSelectedFigure();
        if (fig) {
          this.authority.dispatch({
            t: 'fig.patch',
            id: fig.id,
            patch: { color: chip.getAttribute('data-color') }
          });
        }
      }
    });

    propPerspectiveNote?.addEventListener('change', () => {
      const fig = this.state.getSelectedFigure();
      if (fig) {
        this.authority.dispatch({
          t: 'fig.patch',
          id: fig.id,
          patch: { perspectiveNote: propPerspectiveNote.value }
        });
      }
    });

    document.getElementById('btnAddTag')?.addEventListener('click', () => {
      const input = document.getElementById('newTagInput');
      const val = input.value.trim();
      const fig = this.state.getSelectedFigure();
      if (val && fig) {
        const tags = [...(fig.tags || []), val];
        this.authority.dispatch({
          t: 'fig.patch',
          id: fig.id,
          patch: { tags }
        });
        input.value = '';
      }
    });

    tagsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove-tag]');
      if (btn) {
        const idx = parseInt(btn.getAttribute('data-remove-tag'), 10);
        const fig = this.state.getSelectedFigure();
        if (fig && fig.tags) {
          const tags = fig.tags.filter((_, i) => i !== idx);
          this.authority.dispatch({
            t: 'fig.patch',
            id: fig.id,
            patch: { tags }
          });
        }
      }
    });

    document.getElementById('btnAddSentence')?.addEventListener('click', () => {
      const input = document.getElementById('newSentenceInput');
      const val = input.value.trim();
      const fig = this.state.getSelectedFigure();
      if (val && fig) {
        const sentences = [...(fig.sentences || []), { id: `sent-${Date.now()}`, text: val, by: this.role }];
        this.authority.dispatch({
          t: 'fig.patch',
          id: fig.id,
          patch: { sentences }
        });
        input.value = '';
      }
    });

    sentencesContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-remove-sentence]');
      if (btn) {
        const idx = parseInt(btn.getAttribute('data-remove-sentence'), 10);
        const fig = this.state.getSelectedFigure();
        if (fig && fig.sentences) {
          const sentences = fig.sentences.filter((_, i) => i !== idx);
          this.authority.dispatch({
            t: 'fig.patch',
            id: fig.id,
            patch: { sentences }
          });
        }
      }
    });

    btnToggleZone?.addEventListener('click', () => {
      const fig = this.state.getSelectedFigure();
      if (fig) {
        const newZone = fig.zone === 'table' ? 'waiting' : 'table';
        const newY = newZone === 'waiting' ? 880 : 430;
        this.authority.dispatch({
          t: 'fig.move',
          id: fig.id,
          x: fig.x,
          y: newY,
          angle: fig.angle,
          zone: newZone
        });
      }
    });

    btnDeleteFig?.addEventListener('click', () => {
      const fig = this.state.getSelectedFigure();
      if (fig && confirm(`'${fig.label}' 피규어를 보드에서 삭제하시겠습니까?`)) {
        this.authority.dispatch({
          t: 'fig.remove',
          id: fig.id
        });
      }
    });

    this.state.subscribe(() => {
      updateInspector();
    });
  }

  bindTimelineEvents() {
    const strip = document.getElementById('snapshotStrip');
    const mList = document.getElementById('mobileSnapshotList');
    const btnTake = document.getElementById('btnTakeSnapshot');
    const btnMobileTake = document.getElementById('btnMobileTakeSnapshot');

    const updateTimeline = () => {
      const snaps = this.state.session.snapshots || [];
      if (snaps.length === 0) {
        if (strip) strip.innerHTML = `<span class="text-xs text-slate-400 italic">저장된 스냅샷이 없습니다. 중요한 순간에 스냅샷을 남겨보세요.</span>`;
        if (mList) mList.innerHTML = `<span class="text-xs text-slate-400 italic">저장된 스냅샷이 없습니다.</span>`;
        return;
      }

      const html = snaps.map((s, idx) => `
        <div class="px-3 py-2 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-xl cursor-pointer shrink-0 transition flex items-center space-x-2" data-snapshot-idx="${idx}">
          <div class="w-2 h-2 rounded-full bg-blue-500"></div>
          <div>
            <span class="font-bold text-xs text-slate-800 block">${s.name}</span>
            <span class="font-mono text-[9px] text-slate-400">${s.at.slice(11, 19)}</span>
          </div>
        </div>
      `).join('');

      if (strip) strip.innerHTML = html;
      if (mList) mList.innerHTML = html;
    };

    const takeSnap = () => {
      const defaultName = `스냅샷 ${this.state.session.snapshots.length + 1}`;
      const name = prompt('스냅샷 이름을 입력하세요:', defaultName);
      if (name) {
        this.authority.dispatch({
          t: 'snap.add',
          snap: {
            id: `snap-${Date.now()}`,
            name,
            at: new Date().toISOString(),
            stage: this.state.session.stage,
            figures: JSON.parse(JSON.stringify(this.state.session.figures)),
            links: JSON.parse(JSON.stringify(this.state.session.links))
          }
        });
      }
    };

    btnTake?.addEventListener('click', takeSnap);
    btnMobileTake?.addEventListener('click', takeSnap);

    const handleRestore = (e) => {
      const item = e.target.closest('[data-snapshot-idx]');
      if (item) {
        const idx = parseInt(item.getAttribute('data-snapshot-idx'), 10);
        const snap = this.state.session.snapshots[idx];
        if (snap && confirm(`[${snap.name}] 스냅샷 상태로 보드를 되돌리시겠습니까?`)) {
          this.authority.dispatch({
            t: 'session.patch',
            patch: {
              figures: JSON.parse(JSON.stringify(snap.figures)),
              links: JSON.parse(JSON.stringify(snap.links))
            }
          });
          document.getElementById('mobileTimelineModal')?.classList.add('hidden');
        }
      }
    };

    strip?.addEventListener('click', handleRestore);
    mList?.addEventListener('click', handleRestore);

    this.state.subscribe((session, ui, changeType) => {
      if (changeType === 'snapshots') {
        updateTimeline();
      }
    });
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const app = new App();
  app.init();
});

  </script>
</body>
